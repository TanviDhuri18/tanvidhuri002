        .gallery-item:hover {
            transform: scale(1.05);
        }
        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .gallery-info {
            padding: 15px;
            text-align: center;
        }
        .download-btn {
            display: inline-block;
            background: #0072ff;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .download-btn:hover {
            background: #005bb5;
        }
        @media (max-width: 768px) {
            .gallery-item img {
                height: 150px;
            }
        }
